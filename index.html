<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Margo — Notes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=VT323&display=swap');

:root{
  --bg:#12081a; --bg2:#1b0f26; --surface:#241531; --surface2:#2e1c3d;
  --border:#3d2650; --text:#f0e3ec; --text-dim:#b79bc4; --text-faint:#7c6389;
  --accent:#e88fb0; --accent2:#c96fa8; --accent-glow:rgba(232,143,176,.35);
  --shadow:rgba(0,0,0,.5); --canvas-bg:#1b0f26;
  --font-display:'Cinzel Decorative', serif; --font-body:'EB Garamond', serif; --font-mono:'VT323', monospace;
}
[data-theme="parchment"]{
  --bg:#efe6d3; --bg2:#e6d9bd; --surface:#f6efdd; --surface2:#ecdfc4;
  --border:#c9b78f; --text:#3a2c1a; --text-dim:#6b5a3d; --text-faint:#8f7c5c;
  --accent:#a8492f; --accent2:#8a3a25; --accent-glow:rgba(168,73,47,.25);
  --shadow:rgba(90,70,40,.25); --canvas-bg:#f6efdd;
}
[data-theme="midnight"]{
  --bg:#080b14; --bg2:#0d1220; --surface:#121a2b; --surface2:#182238;
  --border:#233252; --text:#dce6f5; --text-dim:#8fa3c4; --text-faint:#5d6f8f;
  --accent:#5fb3e0; --accent2:#3f8fc4; --accent-glow:rgba(95,179,224,.3);
  --shadow:rgba(0,0,0,.55); --canvas-bg:#0d1220;
}
[data-theme="moss"]{
  --bg:#0e1710; --bg2:#152018; --surface:#1c2a1f; --surface2:#243528;
  --border:#33492f; --text:#e6ecdf; --text-dim:#a3b89a; --text-faint:#6f8267;
  --accent:#9cc06a; --accent2:#7ba04c; --accent-glow:rgba(156,192,106,.3);
  --shadow:rgba(0,0,0,.5); --canvas-bg:#152018;
}
[data-theme="paperwhite"]{
  --bg:#f4f4f6; --bg2:#ebebef; --surface:#ffffff; --surface2:#f1f1f5;
  --border:#dcdce3; --text:#211f26; --text-dim:#5a5866; --text-faint:#94919e;
  --accent:#6c5ce7; --accent2:#5b4bd1; --accent-glow:rgba(108,92,231,.2);
  --shadow:rgba(30,25,50,.12); --canvas-bg:#ffffff;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  overflow:hidden; touch-action:manipulation;
}
.bg-veil{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 15% -10%, var(--accent-glow), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, var(--accent-glow), transparent 60%);
  opacity:.5;
}

.app{ position:relative; z-index:1; height:100vh; height:100dvh; display:flex; flex-direction:column;}

.topbar{
  display:flex; align-items:center; gap:.5rem; padding:.55rem .6rem;
  background:var(--surface); border-bottom:1px solid var(--border);
  flex-shrink:0; z-index:30;
}
.iconbtn{
  width:40px; height:40px; min-width:40px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; cursor:pointer; transition:background .15s, transform .1s;
}
.iconbtn:active{ transform:scale(.92); background:var(--accent-glow); }
.brand{
  font-family:var(--font-display); font-size:1.05rem; letter-spacing:.5px; color:var(--accent);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; text-align:center;
}
.topbar-spacer{flex:1;}

.layout{ flex:1; display:flex; min-height:0; position:relative; }
.sidebar{
  position:fixed; top:0; bottom:0; left:0; width:82vw; max-width:300px;
  background:var(--bg2); border-right:1px solid var(--border);
  transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:40; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top);
}
.sidebar.open{ transform:translateX(0); box-shadow:20px 0 40px var(--shadow); }
.sidebar-scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none;
  transition:opacity .25s; z-index:35;
}
.sidebar-scrim.show{ opacity:1; pointer-events:auto; }

.sidebar-head{ padding:1rem .9rem .6rem; border-bottom:1px solid var(--border); }
.sidebar-head h2{ margin:0 0 .6rem; font-family:var(--font-display); font-size:1rem; color:var(--accent); font-weight:400;}
.new-note-btn{
  width:100%; padding:.65rem; border-radius:10px; border:1px dashed var(--accent2);
  background:transparent; color:var(--accent); font-family:var(--font-body); font-size:.95rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.4rem;
}
.new-note-btn:active{ background:var(--accent-glow); }
.search-box{
  margin:.6rem .9rem 0; padding:.5rem .7rem; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:.9rem; width:calc(100% - 1.8rem);
}
.search-box::placeholder{ color:var(--text-faint); }

.note-list{ flex:1; overflow-y:auto; padding:.5rem; -webkit-overflow-scrolling:touch; }
.note-item{
  padding:.7rem .75rem; border-radius:10px; margin-bottom:.35rem; cursor:pointer;
  border:1px solid transparent; position:relative;
}
.note-item:active{ background:var(--surface2); }
.note-item.active{ background:var(--surface2); border-color:var(--accent2); }
.note-item .title{ font-weight:600; font-size:.92rem; margin-bottom:.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-item .preview{ font-size:.78rem; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-item .meta{ font-size:.68rem; color:var(--text-faint); margin-top:.25rem; display:flex; gap:.4rem; align-items:center;}
.note-item .del{
  position:absolute; right:.4rem; top:.4rem; width:26px; height:26px; border-radius:7px;
  background:transparent; border:none; color:var(--text-faint); font-size:.85rem; display:none; align-items:center; justify-content:center;
}
.note-item:hover .del, .note-item.active .del{ display:flex; }
.empty-hint{ padding:1.5rem 1rem; text-align:center; color:var(--text-faint); font-size:.85rem; }

.sidebar-foot{ padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom)); border-top:1px solid var(--border); }
.theme-row{ display:flex; gap:.4rem; flex-wrap:wrap; }
.theme-dot{
  width:30px; height:30px; border-radius:50%; border:2px solid var(--border); cursor:pointer; position:relative; flex-shrink:0;
}
.theme-dot.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
.theme-dot[data-t="void"]{ background:linear-gradient(135deg,#12081a,#e88fb0); }
.theme-dot[data-t="parchment"]{ background:linear-gradient(135deg,#efe6d3,#a8492f); }
.theme-dot[data-t="midnight"]{ background:linear-gradient(135deg,#080b14,#5fb3e0); }
.theme-dot[data-t="moss"]{ background:linear-gradient(135deg,#0e1710,#9cc06a); }
.theme-dot[data-t="paperwhite"]{ background:linear-gradient(135deg,#f4f4f6,#6c5ce7); }
.backup-row{ display:flex; gap:.4rem; margin-top:.7rem; }
.backup-btn{
  flex:1; padding:.5rem .3rem; border-radius:9px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text-dim); font-family:var(--font-body); font-size:.78rem; cursor:pointer;
}
.backup-btn:active{ background:var(--accent-glow); color:var(--accent); }

.main{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

.toolbar{
  display:flex; align-items:center; gap:.3rem; padding:.4rem .4rem; background:var(--surface);
  border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0;
  scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{ display:none; }
.tbtn{
  min-width:38px; height:38px; padding:0 .5rem; border-radius:8px; border:1px solid transparent;
  background:transparent; color:var(--text-dim); font-size:1rem; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-body);
}
.tbtn.active{ background:var(--accent-glow); color:var(--accent); border-color:var(--accent2); }
.tbtn:active{ transform:scale(.93); }
.tsep{ width:1px; height:22px; background:var(--border); flex-shrink:0; margin:0 .15rem; }
.color-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; cursor:pointer; }
.color-swatch.active{ border-color:var(--text); }

.title-input{
  width:100%; border:none; background:transparent; color:var(--text); font-family:var(--font-display);
  font-size:1.3rem; padding:.9rem 1rem .3rem; outline:none;
}
.title-input::placeholder{ color:var(--text-faint); }

.editor-wrap{ flex:1; position:relative; min-height:0; overflow:hidden; }
.editor{
  height:100%; overflow-y:auto; padding:.5rem 1.1rem 3rem; outline:none; font-size:1.05rem;
  line-height:1.65; -webkit-overflow-scrolling:touch;
}
.editor:empty:before{ content:attr(data-placeholder); color:var(--text-faint); }
.editor h1{ font-family:var(--font-display); font-size:1.5rem; color:var(--accent); margin:.6em 0 .3em; font-weight:400;}
.editor h2{ font-family:var(--font-display); font-size:1.2rem; color:var(--accent2); margin:.6em 0 .3em; font-weight:400;}
.editor blockquote{ border-left:3px solid var(--accent2); margin:.5em 0; padding:.2em 0 .2em 1em; color:var(--text-dim); font-style:italic;}
.editor ul, .editor ol{ padding-left:1.4em; }
.editor img{ max-width:100%; height:auto; border-radius:10px; display:block; margin:.6em 0; border:1px solid var(--border); }
.editor img.img-selected{ outline:2px solid var(--accent); }

.draw-canvas{
  position:absolute; inset:0; touch-action:none; display:none;
}
.draw-canvas.active{ display:block; }

.empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem;
  color:var(--text-faint); padding:2rem; text-align:center;
}
.empty-state .lobo{ font-size:2.6rem; }
.empty-state .startbtn{
  padding:.7rem 1.3rem; border-radius:10px; border:1px solid var(--accent2); background:var(--surface2);
  color:var(--accent); font-family:var(--font-body); font-size:.95rem; cursor:pointer;
}

.draw-panel{
  display:flex; align-items:center; gap:.5rem; padding:.4rem .5rem; background:var(--surface2);
  border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0;
}
.range-wrap{ display:flex; align-items:center; gap:.3rem; flex-shrink:0; }
.range-wrap input[type=range]{ width:70px; accent-color:var(--accent); }
.range-wrap span{ font-size:.75rem; color:var(--text-faint); width:20px; }

@media (min-width:820px){
  .sidebar{ position:relative; transform:none; width:280px; box-shadow:none; }
  .sidebar-scrim{ display:none; }
  .menu-toggle{ display:none; }
  .brand{ text-align:left; }
}
</style>
</head>
<body>
<div class="bg-veil"></div>
<div class="app" data-theme-root>

  <div class="topbar">
    <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Toggle notes list">☰</button>
    <div class="brand">✦ Margo</div>
    <div class="topbar-spacer"></div>
    <button class="iconbtn" id="drawToggle" aria-label="Toggle drawing" title="Draw">✎</button>
    <button class="iconbtn" id="importBtn" aria-label="Import note" title="Import a note file">⇧</button>
    <button class="iconbtn" id="shareBtn" aria-label="Export note" title="Export this note">⇩</button>
    <input type="file" id="fileInput" accept=".mnote,.mnotes,.json,.txt,application/json,text/plain" style="display:none">
  </div>

  <div class="layout">
    <div class="sidebar-scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>Your Notes</h2>
        <button class="new-note-btn" id="newNoteBtn">+ New Note</button>
      </div>
      <input class="search-box" id="searchBox" placeholder="Search notes...">
      <div class="note-list" id="noteList"></div>
      <div class="sidebar-foot">
        <div class="theme-row" id="themeRow">
          <div class="theme-dot" data-t="void" title="Rosey-Dark"></div>
          <div class="theme-dot" data-t="parchment" title="Parchment"></div>
          <div class="theme-dot" data-t="midnight" title="Midnight"></div>
          <div class="theme-dot" data-t="moss" title="Moss"></div>
          <div class="theme-dot" data-t="paperwhite" title="Paperwhite"></div>
        </div>
        <div class="backup-row">
          <button class="backup-btn" id="exportAllBtn">⇩ Export all</button>
          <button class="backup-btn" id="importAllBtn">⇧ Import file</button>
        </div>
      </div>
    </aside>

    <main class="main" id="mainArea">

    </main>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY_PREFIX = 'marginalia-note:';
  const STORAGE_INDEX_KEY = 'marginalia-index';
  const STORAGE_THEME_KEY = 'marginalia-theme';

  let notes = [];        
  let activeId = null;
  let drawMode = false;
  let saveTimer = null;

  const root = document.documentElement;
  const appEl = document.querySelector('.app');
  const mainArea = document.getElementById('mainArea');
  const noteList = document.getElementById('noteList');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const searchBox = document.getElementById('searchBox');

  async function storeGet(key){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value){
    try{ await window.storage.set(key, value); }catch(e){ console.error('save failed', e); }
  }
  async function storeDelete(key){
    try{ await window.storage.delete(key); }catch(e){}
  }

  function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadAll(){
    const idxRaw = await storeGet(STORAGE_INDEX_KEY);
    const idx = idxRaw ? JSON.parse(idxRaw) : [];
    const loaded = [];
    for(const id of idx){
      const raw = await storeGet(STORAGE_KEY_PREFIX + id);
      if(raw){ try{ loaded.push(JSON.parse(raw)); }catch(e){} }
    }
    loaded.sort((a,b)=>b.updated-a.updated);
    notes = loaded;

    const theme = await storeGet(STORAGE_THEME_KEY);
    applyTheme(theme || 'void', false);
  }

  async function persistIndex(){
    await storeSet(STORAGE_INDEX_KEY, JSON.stringify(notes.map(n=>n.id)));
  }
  async function persistNote(note){
    await storeSet(STORAGE_KEY_PREFIX + note.id, JSON.stringify(note));
  }

  function applyTheme(t, save){
    root.setAttribute('data-theme', t === 'void' ? '' : t);
    if(t === 'void') root.removeAttribute('data-theme');
    document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active', d.dataset.t===t));
    if(save) storeSet(STORAGE_THEME_KEY, t);
  }
  document.getElementById('themeRow').addEventListener('click', (e)=>{
    const dot = e.target.closest('.theme-dot');
    if(!dot) return;
    applyTheme(dot.dataset.t, true);
  });

  function openSidebar(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  scrim.addEventListener('click', closeSidebar);

  function renderList(filter){
    noteList.innerHTML = '';
    const f = (filter||'').toLowerCase();
    const filtered = notes.filter(n=>{
      if(!f) return true;
      return (n.title||'').toLowerCase().includes(f) || (n.html||'').toLowerCase().includes(f);
    });
    if(filtered.length === 0){
      noteList.innerHTML = `<div class="empty-hint">${notes.length===0 ? 'No notes yet. Tap “New Note” to begin.' : 'No matches.'}</div>`;
      return;
    }
    for(const n of filtered){
      const div = document.createElement('div');
      div.className = 'note-item' + (n.id===activeId ? ' active' : '');
      const tmp = document.createElement('div'); tmp.innerHTML = n.html || '';
      const preview = (tmp.textContent || '').trim().slice(0,80) || (n.drawing ? '🖌 Sketch' : 'Empty note');
      const d = new Date(n.updated);
      div.innerHTML = `
        <button class="del" data-id="${n.id}" aria-label="Delete note">🗑</button>
        <div class="title">${escapeHtml(n.title || 'Untitled')}</div>
        <div class="preview">${escapeHtml(preview)}</div>
        <div class="meta">${d.toLocaleDateString()} · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
      div.addEventListener('click', (e)=>{
        if(e.target.closest('.del')) return;
        openNote(n.id);
        closeSidebar();
      });
      div.querySelector('.del').addEventListener('click', (e)=>{
        e.stopPropagation();
        deleteNote(n.id);
      });
      noteList.appendChild(div);
    }
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  searchBox.addEventListener('input', ()=> renderList(searchBox.value));

  async function createNote(){
    const note = { id: uid(), title:'', html:'', drawing:null, updated: Date.now() };
    notes.unshift(note);
    await persistNote(note);
    await persistIndex();
    renderList(searchBox.value);
    openNote(note.id);
    closeSidebar();
  }
  document.getElementById('newNoteBtn').addEventListener('click', createNote);

  async function deleteNote(id){
    notes = notes.filter(n=>n.id!==id);
    await storeDelete(STORAGE_KEY_PREFIX+id);
    await persistIndex();
    if(activeId === id){ activeId = null; renderMain(); }
    renderList(searchBox.value);
  }

  function getActive(){ return notes.find(n=>n.id===activeId); }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const n = getActive();
      if(!n) return;
      n.updated = Date.now();
      await persistNote(n);
      await persistIndex();
      renderList(searchBox.value);
    }, 500);
  }

  function renderMain(){
    const n = getActive();
    if(!n){
      mainArea.innerHTML = `
        <div class="empty-state">
          <div class="lobo">🕯️✦🕯️</div>
          <div>Select a note, or begin a new page.</div>
          <button class="startbtn" id="emptyNewBtn">+ New Note</button>
        </div>`;
      document.getElementById('emptyNewBtn').addEventListener('click', createNote);
      return;
    }
    mainArea.innerHTML = `
      <div class="toolbar" id="textToolbar">
        <button class="tbtn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="tbtn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="tbtn" data-cmd="underline" title="Underline"><u>U</u></button>
        <div class="tsep"></div>
        <button class="tbtn" data-block="h1" title="Heading">H1</button>
        <button class="tbtn" data-block="h2" title="Subheading">H2</button>
        <button class="tbtn" data-block="blockquote" title="Quote">❝</button>
        <div class="tsep"></div>
        <button class="tbtn" data-cmd="insertUnorderedList" title="Bulleted list">• ≡</button>
        <button class="tbtn" data-cmd="insertOrderedList" title="Numbered list">1. ≡</button>
        <div class="tsep"></div>
        <button class="tbtn" data-cmd="justifyLeft" title="Align left">⟸</button>
        <button class="tbtn" data-cmd="justifyCenter" title="Align center">≡</button>
        <div class="tsep"></div>
        <button class="tbtn" data-cmd="removeFormat" title="Clear formatting">⨯</button>
        <div class="tsep"></div>
        <button class="tbtn" id="insertImgBtn" title="Add photo">📷</button>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none">
      <div class="draw-panel" id="drawPanel" style="display:none;">
        <div class="color-swatch active" data-color="#e88fb0" style="background:#e88fb0"></div>
        <div class="color-swatch" data-color="#f0e3ec" style="background:#f0e3ec"></div>
        <div class="color-swatch" data-color="#c96fa8" style="background:#c96fa8"></div>
        <div class="color-swatch" data-color="#5fb3e0" style="background:#5fb3e0"></div>
        <div class="color-swatch" data-color="#9cc06a" style="background:#9cc06a"></div>
        <div class="tsep"></div>
        <div class="range-wrap">✎<input type="range" id="penSize" min="1" max="20" value="3"><span id="penSizeLabel">3</span></div>
        <div class="tsep"></div>
        <button class="tbtn" id="eraserBtn" title="Eraser">🧹</button>
        <button class="tbtn" id="clearDrawBtn" title="Clear drawing">🗑 Sketch</button>
      </div>
      <input class="title-input" id="titleInput" placeholder="Untitled note" value="${n.title ? n.title.replace(/"/g,'&quot;') : ''}">
      <div class="editor-wrap">
        <div class="editor" id="editor" contenteditable="true" data-placeholder="Start writing...">${n.html||''}</div>
        <canvas class="draw-canvas" id="drawCanvas"></canvas>
      </div>
    `;
    setupEditor(n);
    setupDrawing(n);
    setDrawMode(drawMode);
  }

  function openNote(id){
    activeId = id;
    drawMode = false;
    renderMain();
    renderList(searchBox.value);
  }

  function setupEditor(n){
    const titleInput = document.getElementById('titleInput');
    const editor = document.getElementById('editor');
    titleInput.addEventListener('input', ()=>{ n.title = titleInput.value; scheduleSave(); });
    editor.addEventListener('input', ()=>{ n.html = editor.innerHTML; scheduleSave(); });

    document.getElementById('textToolbar').addEventListener('click', (e)=>{
      const btn = e.target.closest('.tbtn');
      if(!btn) return;
      if(btn.id === 'insertImgBtn'){
        saveSelection(editor);
        document.getElementById('imgInput').click();
        return;
      }
      editor.focus();
      if(btn.dataset.cmd){
        document.execCommand(btn.dataset.cmd, false, null);
      } else if(btn.dataset.block){
        document.execCommand('formatBlock', false, btn.dataset.block);
      }
      n.html = editor.innerHTML; scheduleSave();
    });

    editor.addEventListener('click', (e)=>{
      const img = e.target.closest('img');
      if(!img) return;
      if(confirm('Remove this photo from the note?')){
        img.remove();
        n.html = editor.innerHTML; scheduleSave();
      }
    });

    let savedRange = null;
    function saveSelection(container){
      const sel = window.getSelection();
      if(sel.rangeCount === 0) { savedRange = null; return; }
      const range = sel.getRangeAt(0);
      if(container.contains(range.commonAncestorContainer)){
        savedRange = range.cloneRange();
      } else {

        const r = document.createRange();
        r.selectNodeContents(container);
        r.collapse(false);
        savedRange = r;
      }
    }
    function restoreSelection(){
      const sel = window.getSelection();
      sel.removeAllRanges();
      if(savedRange) sel.addRange(savedRange);
    }
    function compressImage(file){
      return new Promise((resolve, reject)=>{
        const img = new Image();
        const reader = new FileReader();
        reader.onload = ()=>{ img.onload = ()=>{
          const maxSide = 1280;
          let {width, height} = img;
          if(width > maxSide || height > maxSide){
            const scale = maxSide / Math.max(width, height);
            width = Math.round(width*scale); height = Math.round(height*scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    document.getElementById('imgInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      e.target.value = '';
      if(!file) return;
      try{
        const dataUrl = await compressImage(file);
        editor.focus();
        restoreSelection();
        document.execCommand('insertHTML', false,
          `<img src="${dataUrl}" alt="photo">`);
        n.html = editor.innerHTML;
        scheduleSave();
      }catch(err){
        alert("Couldn't add that photo — try a different image.");
      }
    });
  }

  function setupDrawing(n){
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false, lastX=0, lastY=0, color='#e88fb0', size=3, erasing=false;

    function resize(){
      const rect = canvas.parentElement.getBoundingClientRect();
      const prevData = canvas.width ? canvas.toDataURL() : null;
      canvas.width = rect.width; canvas.height = rect.height;
      if(n.drawing){
        const img = new Image();
        img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height);
        img.src = n.drawing;
      } else if(prevData){
        const img = new Image();
        img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height);
        img.src = prevData;
      }
    }
    resize();
    window.addEventListener('resize', resize);

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {x: cx-rect.left, y: cy-rect.top};
    }
    function start(e){
      if(!drawMode) return;
      e.preventDefault();
      drawing = true;
      const p = pos(e); lastX=p.x; lastY=p.y;
    }
    function move(e){
      if(!drawing || !drawMode) return;
      e.preventDefault();
      const p = pos(e);
      ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color; ctx.lineWidth = erasing ? size*4 : size;
      ctx.lineCap = 'round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y;
    }
    function end(){
      if(!drawing) return;
      drawing = false;
      n.drawing = canvas.toDataURL();
      scheduleSave();
    }
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);

    document.getElementById('drawPanel').addEventListener('click', (e)=>{
      const sw = e.target.closest('.color-swatch');
      if(sw){
        document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
        sw.classList.add('active');
        color = sw.dataset.color; erasing=false;
        document.getElementById('eraserBtn').classList.remove('active');
      }
      if(e.target.id === 'eraserBtn'){
        erasing = !erasing;
        e.target.classList.toggle('active', erasing);
      }
      if(e.target.id === 'clearDrawBtn'){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        n.drawing = null; scheduleSave();
      }
    });
    const penSize = document.getElementById('penSize');
    penSize.addEventListener('input', ()=>{
      size = parseInt(penSize.value,10);
      document.getElementById('penSizeLabel').textContent = size;
    });
  }

  function setDrawMode(on){
    drawMode = on;
    const canvas = document.getElementById('drawCanvas');
    const panel = document.getElementById('drawPanel');
    const textToolbar = document.getElementById('textToolbar');
    const editor = document.getElementById('editor');
    if(!canvas) return;
    canvas.classList.toggle('active', on);
    panel.style.display = on ? 'flex' : 'none';
    textToolbar.style.display = on ? 'none' : 'flex';
    editor.style.pointerEvents = on ? 'none' : 'auto';
    document.getElementById('drawToggle').classList.toggle('active', on);
  }
  document.getElementById('drawToggle').addEventListener('click', ()=>{
    if(!getActive()) return;
    setDrawMode(!drawMode);
  });

  function downloadJSON(obj, filename){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function safeFilename(s){
    return (s || 'note').replace(/[^a-z0-9\-_ ]/gi,'').trim().slice(0,40) || 'note';
  }

  document.getElementById('shareBtn').addEventListener('click', ()=>{
    const n = getActive();
    if(!n){ alert('Open a note first.'); return; }
    downloadJSON(
      { type:'marginalia-note', version:1, title:n.title||'', html:n.html||'', drawing:n.drawing||null },
      safeFilename(n.title) + '.mnote'
    );
  });

  document.getElementById('exportAllBtn').addEventListener('click', ()=>{
    if(notes.length === 0){ alert('No notes to export yet.'); return; }
    downloadJSON(
      { type:'marginalia-backup', version:1, notes: notes.map(n=>({title:n.title||'', html:n.html||'', drawing:n.drawing||null})) },
      'marginalia-backup.mnotes'
    );
  });

  const fileInput = document.getElementById('fileInput');
  function triggerImport(){ fileInput.value=''; fileInput.click(); }
  document.getElementById('importBtn').addEventListener('click', triggerImport);
  document.getElementById('importAllBtn').addEventListener('click', triggerImport);

  async function addImportedNote(data){
    const note = {
      id: uid(),
      title: (data.title || 'Imported note'),
      html: data.html || '',
      drawing: data.drawing || null,
      updated: Date.now()
    };
    notes.unshift(note);
    await persistNote(note);
    return note;
  }

  fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const text = await file.text();
    let imported = [];
    try{
      const data = JSON.parse(text);
      if(data.type === 'marginalia-backup' && Array.isArray(data.notes)){
        for(const n of data.notes) imported.push(await addImportedNote(n));
      } else if(data.type === 'marginalia-note' || data.html !== undefined){
        imported.push(await addImportedNote(data));
      } else {
        throw new Error('unrecognized-json');
      }
    } catch(err){

      const escaped = text.split('\n').map(line=>`<p>${escapeHtml(line)}</p>`).join('');
      imported.push(await addImportedNote({ title: file.name.replace(/\.[^.]+$/,''), html: escaped }));
    }
    await persistIndex();
    renderList(searchBox.value);
    if(imported.length){ openNote(imported[0].id); closeSidebar(); }
  });

  (async function init(){
    await loadAll();
    renderList('');
    renderMain();
  })();
})();
</script>
